services:
  mysql:
    image: mysql:8.4
    container_name: next-siheung-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"   # PC에 MySQL이 이미 3306을 쓰면 .env에서 DB_PORT=3307 등으로 변경
    environment:
      MYSQL_DATABASE: next_siheung
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
