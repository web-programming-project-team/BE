name: BE CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]          # main에 머지되면 build 후 deploy까지

jobs:
  build:
    runs-on: ubuntu-latest

    # job이 도는 동안 옆에 MySQL 컨테이너를 띄운다 (docker-compose.yml의 mysql과 같은 역할)
    services:
      mysql:
        image: mysql:8.4                 # docker-compose.yml과 같은 버전
        env:
          MYSQL_DATABASE: next_siheung
          MYSQL_USER: nextstep
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
          TZ: Asia/Seoul                 # DB의 now()를 한국 시간으로
        ports:
          - 3306:3306
        # MySQL이 접속을 받을 준비가 될 때까지 기다린다. 없으면 테스트가 먼저 시작해 연결 실패
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TZ: Asia/Seoul                                   # JVM도 한국 시간
      # application-local.yml 대신 환경변수로
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/next_siheung?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: nextstep
      SPRING_DATASOURCE_PASSWORD: ci-password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create            # 빈 DB에 엔티티 기준으로 테이블 생성
      APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트
        run: ./gradlew build             # 컴파일 + 테스트 + jar 생성. 테스트 하나라도 실패하면 빨간 X

      # 실패했을 때만 테스트 리포트(HTML)를 내려받을 수 있게 올려 둔다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      # main에 머지됐을 때만 jar를 deploy job에 넘긴다
      - name: jar 넘기기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/next-siheung-0.0.1-SNAPSHOT.jar   # -plain.jar 말고 이것
          retention-days: 1

  # build가 성공하고 main에 머지됐을 때만 운영 서버(EC2)에 배포
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-be               # 연달아 머지돼도 배포가 겹치지 않고 차례로
    env:
      HOST: ${{ secrets.EC2_HOST }}

    steps:
      - name: jar 받기
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: jar 올리기
        run: scp -i ~/.ssh/deploy_key next-siheung-0.0.1-SNAPSHOT.jar ubuntu@$HOST:~/app.jar.new

      # 교체 → 재시작 → 최대 2분 헬스 체크. 안 뜨면 이전 jar로 되돌리고 실패 처리
      - name: 교체 + 재시작 + 헬스 체크
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@$HOST 'bash -s' <<'EOF'
          set -e
          cd /opt/next-siheung
          sudo cp app.jar app.jar.bak
          sudo mv ~/app.jar.new app.jar
          sudo systemctl restart next-siheung
          for i in $(seq 1 40); do
            if curl -fs localhost:8080/api/v1/health | grep -q UP; then
              echo "배포 성공"; exit 0
            fi
            sleep 3
          done
          echo "헬스 체크 실패 → 이전 버전으로 되돌림"
          sudo cp app.jar.bak app.jar
          sudo systemctl restart next-siheung
          exit 1
          EOF
